<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mindful Journal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="icon">
                ✨
            </div>
            <h1>Mindful Journal</h1>
            <p class="subtitle">
                Turn your feelings into meaningful thoughts.</p>
            <label for="mood">
                How are you feeling today?
            </label>
            <select id="mood">
                <option value="">Choose your mood</option>

                <option value="happy">😊 Happy</option>

                <option value="stressed">😰 Stressed</option>

                <option value="curious">🤔 Curious</option>

                <option value="tired">😴 Tired</option>

                <option value="sad">😔 Sad</option>

                <option value="calm">😌 Calm</option>

                <option value="excited">🤩 Excited</option>

            </select>

            <button id="generateBtn"> ✨ Generate Journal prompt</button>

            <div id="loading" class="loading">reating your prompt...</div>

            <div id="result" class="result">

                <div class="result-title">
                    💭 Your Journal Prompt
                </div>

                <p id="prompt"></p>

            </div>

        </div>

        <p class="footer">
            Take a moment. Write your thoughts. 🌷
        </p>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="script.js"></script>

</body>

</html>
